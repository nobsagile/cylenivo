version: 2

# Strategy: security fixes always come through (they are enabled at repo level and
# ignore this file entirely). Version updates are reduced to patches, grouped into
# one PR per ecosystem per week, so a merge is a decision and not a reflex.
# Majors and minors are deliberately NOT proposed — pick those up on purpose,
# with time to read a changelog.
updates:
  # Actions tag as v6 → v7, which Dependabot reads as a major. Ignoring majors
  # here would mean never updating actions again, so this one stays open —
  # grouped, and small enough to review by eye.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 5
    groups:
      actions:
        patterns: ["*"]
    labels: ["chore", "app", "dependencies", "github_actions"]

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 5
    groups:
      cargo-patch:
        patterns: ["*"]
        update-types: ["patch"]
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    labels: ["chore", "app", "dependencies", "rust"]

  # Frontend: 52 dependencies, and the ones most likely to break at runtime
  # (Radix, dnd-kit) are the ones tests do not cover. Patches only.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    # Supply-chain cooldown: a compromised release is usually yanked within
    # hours to days. Waiting means Dependabot never even proposes it.
    # Applies to VERSION updates only — security updates ignore cooldown.
    cooldown:
      default-days: 5
    groups:
      npm-patch:
        patterns: ["*"]
        update-types: ["patch"]
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    labels: ["chore", "app", "dependencies"]

  # Server: bun ecosystem against bun.lock — the lockfile the build actually
  # uses (`bun build --compile`). The stale package-lock.json is gone (#118).
  # Trade-off: Dependabot does NOT create security PRs for bun.lock, only
  # version PRs. Acceptable at 2 prod dependencies (hono, drizzle-orm) —
  # security alerts still arrive via the dependency graph, the fix is a manual
  # bump. Longest cooldown here on purpose: a payload in the server ends up
  # compiled into the sidecar binary with full process access; the frontend is
  # sandboxed by the WebView and its CSP, the server is not.
  - package-ecosystem: "bun"
    directory: "/server"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    groups:
      bun-patch:
        patterns: ["*"]
        update-types: ["patch"]
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    labels: ["chore", "app", "dependencies"]
